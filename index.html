<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaExchange</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151c2c;
            --bg-input: #1e293b;
            --primary: #3b82f6;
            --accent: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --up: #10b981;
            --down: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 70px;
        }

        header {
            background: linear-gradient(135deg, #1e1b4b, #0f172a);
            padding: 1.25rem 1rem;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: #fff;
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.4);
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo-text span {
            color: var(--accent);
        }

        .controls-top {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .refresh-btn {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            border-color: var(--primary);
            background: #26334d;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 900px) {
            .container {
                grid-template-columns: 350px 1fr;
            }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.25rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .field-group {
            margin-bottom: 1rem;
        }

        .field-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        select, input {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--accent);
        }

        .converter-result {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--bg-input);
            border-radius: 8px;
            text-align: center;
        }

        .converter-result .res-val {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent);
        }

        .timestamp-box {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 10px;
            text-align: center;
        }

        .search-bar {
            margin-bottom: 1rem;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }

        @media (min-width: 600px) {
            .grid-cards {
                grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            }
        }

        .rate-card {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: transform 0.2s;
        }

        .rate-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .rate-code {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .rate-val {
            font-size: 1.15rem;
            font-weight: 700;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 1000;
        }

        @media (min-width: 900px) {
            .bottom-nav {
                display: none;
            }
        }

        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .nav-item.active {
            color: var(--accent);
        }

        .chart-box {
            height: 250px;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo-area">
                <div class="logo-icon">N</div>
                <div class="logo-text">Nova<span>Exchange</span></div>
            </div>
            <div class="controls-top">
                <button class="refresh-btn" id="manual-refresh">
                    <span id="refresh-icon">↻</span> Обновить
                </button>
            </div>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <div class="card" id="converter-section">
                <div class="card-title">Конвертер</div>
                <div class="field-group">
                    <label>Сумма</label>
                    <input type="number" id="conv-amount" value="100" min="0">
                </div>
                <div class="field-group">
                    <label>Из валюты</label>
                    <select id="conv-from"></select>
                </div>
                <div class="field-group">
                    <label>В валюту</label>
                    <select id="conv-to"></select>
                </div>
                <div class="converter-result">
                    <div style="font-size: 0.85rem; color: var(--text-muted);">Итог</div>
                    <div class="res-val" id="conv-result">0.00</div>
                </div>
            </div>

            <div class="card" style="margin-top: 1.5rem;">
                <div class="card-title">Динамика</div>
                <div class="field-group">
                    <label>Валютная пара к USD</label>
                    <select id="chart-currency"></select>
                </div>
                <div class="chart-box">
                    <canvas id="rateChart"></canvas>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="card" id="rates-section">
                <div class="card-title">
                    <span>Курсы валют</span>
                    <span id="auto-timer" style="font-size: 0.75rem; color: var(--accent);">Автообновление: 60с</span>
                </div>
                
                <div style="display: flex; gap: 10px; margin-bottom: 1rem;">
                    <select id="base-currency" style="max-width: 160px;"></select>
                    <input type="text" id="search-input" class="search-bar" placeholder="Поиск валюты...">
                </div>

                <div class="timestamp-box" id="last-update">Время получения: --:--:--</div>
                <div class="grid-cards" id="currency-grid" style="margin-top: 1rem;"></div>
            </div>
        </main>
    </div>

    <nav class="bottom-nav">
        <a href="#rates-section" class="nav-item active">Курсы</a>
        <a href="#converter-section" class="nav-item">Конвертер</a>
    </nav>

    <script>
        const CURRENCIES = [
            { code: "USD", name: "Доллар США", symbol: "$" },
            { code: "EUR", name: "Евро", symbol: "€" },
            { code: "RUB", name: "Российский рубль", symbol: "₽" },
            { code: "AZN", name: "Азербайджанский манат", symbol: "₼" },
            { code: "UAH", name: "Украинская гривна", symbol: "₴" },
            { code: "KZT", name: "Тенге", symbol: "₸" },
            { code: "GEL", name: "Лари", symbol: "₾" },
            { code: "AMD", name: "Армянский драм", symbol: "֏" },
            { code: "BYN", name: "Белорусский рубль", symbol: "Br" },
            { code: "TRY", name: "Турецкая лира", symbol: "₺" },
            { code: "GBP", name: "Фунт стерлингов", symbol: "£" },
            { code: "CNY", name: "Юань", symbol: "¥" },
            { code: "AED", name: "Дирхам ОАЭ", symbol: "د.إ" },
            { code: "JPY", name: "Иена", symbol: "¥" },
            { code: "CAD", name: "Канадский доллар", symbol: "$" },
            { code: "AUD", name: "Австралийский доллар", symbol: "$" },
            { code: "CHF", name: "Швейцарский франк", symbol: "Fr" },
            { code: "PLN", name: "Злотый", symbol: "zł" },
            { code: "BRL", name: "Бразильский реал", symbol: "R$" },
            { code: "INR", name: "Индийская рупия", symbol: "₹" },
            { code: "KGS", name: "Киргизский сом", symbol: "с" },
            { code: "TJS", name: "Таджикский сомони", symbol: "SM" },
            { code: "UZS", name: "Узбекский сум", symbol: "so'm" },
            { code: "KWD", name: "Кувейтский динар", symbol: "د.ك" },
            { code: "QAR", name: "Катарский риал", symbol: "ر.ق" },
            { code: "ILS", name: "Шекель", symbol: "₪" },
            { code: "BDT", name: "Бангладешская така", symbol: "৳" },
            { code: "EGP", name: "Египетский фунт", symbol: "E£" }
        ];

        let ratesData = {};
        let currentBase = "USD";
        let countdown = 60;
        let chartInstance = null;

        const baseSelect = document.getElementById("base-currency");
        const convFrom = document.getElementById("conv-from");
        const convTo = document.getElementById("conv-to");
        const chartCurr = document.getElementById("chart-currency");
        const grid = document.getElementById("currency-grid");
        const searchInput = document.getElementById("search-input");
        const lastUpdate = document.getElementById("last-update");
        const autoTimer = document.getElementById("auto-timer");

        function populateDropdowns() {
            CURRENCIES.forEach(c => {
                const opt1 = new Option(`${c.code} - ${c.name}`, c.code);
                const opt2 = new Option(`${c.code} - ${c.name}`, c.code);
                const opt3 = new Option(`${c.code} - ${c.name}`, c.code);
                const opt4 = new Option(`${c.code} - ${c.name}`, c.code);

                baseSelect.add(opt1);
                convFrom.add(opt2);
                convTo.add(opt3);
                chartCurr.add(opt4);
            });

            baseSelect.value = "USD";
            convFrom.value = "USD";
            convTo.value = "EUR";
            chartCurr.value = "EUR";
        }

        async function fetchRates() {
            try {
                const res = await fetch(`https://open.er-api.com/v6/latest/${currentBase}`);
                const data = await res.json();
                
                if (data && data.rates) {
                    ratesData = data.rates;
                    renderCards();
                    calculateConversion();
                    updateTimestamp();
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderCards() {
            grid.innerHTML = "";
            const query = searchInput.value.toLowerCase();

            CURRENCIES.forEach(c => {
                if (c.code === currentBase) return;
                if (query && !c.code.toLowerCase().includes(query) && !c.name.toLowerCase().includes(query)) return;

                const rate = ratesData[c.code] ? ratesData[c.code].toFixed(4) : "—";
                const card = document.createElement("div");
                card.className = "rate-card";
                card.innerHTML = `
                    <div class="rate-code">
                        <span>${c.code}</span>
                        <span>${c.symbol}</span>
                    </div>
                    <div class="rate-val">${rate}</div>
                    <div style="font-size: 0.75rem; color: var(--text-muted);">${c.name}</div>
                `;
                grid.appendChild(card);
            });
        }

        function calculateConversion() {
            const amount = parseFloat(document.getElementById("conv-amount").value) || 0;
            const from = convFrom.value;
            const to = convTo.value;

            if (ratesData[from] && ratesData[to]) {
                const inBase = amount / ratesData[from];
                const finalVal = inBase * ratesData[to];
                document.getElementById("conv-result").innerText = finalVal.toFixed(2) + " " + to;
            }
        }

        function updateTimestamp() {
            const now = new Date();
            lastUpdate.innerText = `Время получения данных: ${now.toLocaleDateString()} ${now.toLocaleTimeString()}`;
        }

        function initChart() {
            const ctx = document.getElementById("rateChart").getContext("2d");
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'],
                    datasets: [{
                        label: 'Курс к USD',
                        data: [1.08, 1.079, 1.082, 1.085, 1.083, 1.084, 1.086],
                        borderColor: '#06b6d4',
                        tension: 0.3,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#94a3b8' } },
                        y: { ticks: { color: '#94a3b8' } }
                    }
                }
            });
        }

        baseSelect.addEventListener("change", (e) => {
            currentBase = e.target.value;
            fetchRates();
        });

        document.getElementById("conv-amount").addEventListener("input", calculateConversion);
        convFrom.addEventListener("change", calculateConversion);
        convTo.addEventListener("change", calculateConversion);
        searchInput.addEventListener("input", renderCards);

        document.getElementById("manual-refresh").addEventListener("click", () => {
            countdown = 60;
            fetchRates();
        });

        setInterval(() => {
            countdown--;
            autoTimer.innerText = `Автообновление: ${countdown}с`;
            if (countdown <= 0) {
                countdown = 60;
                fetchRates();
            }
        }, 1000);

        populateDropdowns();
        fetchRates();
        initChart();
    </script>
</body>
</html>
